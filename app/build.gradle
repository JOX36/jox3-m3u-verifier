plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 34
    namespace "com.jox3.m3uverifier"

    defaultConfig {
        applicationId "com.jox3.m3uverifier"
        minSdk 21
        targetSdk 34
        // Cada compilación de GitHub Actions sube el número de versión,
        // así Android acepta la nueva como actualización.
        def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
        versionCode 100 + runNumber
        versionName "2.0.${runNumber}"
    }

    // Firma fija: la llave vive en los secretos del repo de GitHub. Con la misma
    // firma siempre, cada APK nuevo se instala encima sin desinstalar.
    def keystorePath = System.getenv("SIGNING_KEYSTORE_PATH")
    def hasReleaseKey = keystorePath != null && new File(keystorePath).exists()

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(keystorePath)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: "jox3"
                keyPassword System.getenv("SIGNING_STORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.annotation:annotation-experimental:1.3.1'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.media3:media3-common:1.3.1'
    implementation 'androidx.media3:media3-datasource:1.3.1'
    implementation 'androidx.media3:media3-extractor:1.3.1'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.media3:media3-cast:1.3.1'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
}
