plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 36
    namespace "com.jox3.m3uverifier"

    defaultConfig {
        applicationId "com.jox3.m3uverifier"
        minSdk 21
        targetSdk 35
        // Cada compilación de GitHub Actions sube el número de versión,
        // así Android acepta la nueva como actualización.
        def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
        versionCode 100 + runNumber
        versionName "2.0.${runNumber}"
    }

    // Firma fija: la llave vive en los secretos del repo de GitHub. Con la misma
    // firma siempre, cada APK nuevo se instala encima sin desinstalar.
    def keystorePath = System.getenv("SIGNING_KEYSTORE_PATH")
    def hasReleaseKey = keystorePath != null && new File(keystorePath).exists()

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(keystorePath)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: "jox3"
                keyPassword System.getenv("SIGNING_STORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Lo pide el decodificador FFmpeg para funcionar también en Android viejos.
        coreLibraryDesugaringEnabled true
    }

}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Versiones en un solo lugar: Media3 y el decodificador FFmpeg de Jellyfin deben ir siempre a la par
    // (1.8.x es la última que sigue funcionando en Android 5, común en TV box viejos).
    def media3 = '1.8.0'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.annotation:annotation-experimental:1.4.1'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    implementation "androidx.media3:media3-common:$media3"
    implementation "androidx.media3:media3-datasource:$media3"
    implementation "androidx.media3:media3-extractor:$media3"
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.media3:media3-cast:$media3"
    // Decodificador de audio por software (FFmpeg) para AC-3, E-AC-3, DTS, MP2… que muchos TV box no traen.
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:$media3+1"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.mediarouter:mediarouter:1.8.0'
}
