<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>JOX3 Verifier</title>
<link rel="preload" href="fonts/inter-Regular.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/inter-SemiBold.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<symbol id="i-list" viewBox="0 0 24 24"><path d="M14 10H3v2h11v-2zm0-4H3v2h11V6zm4 8v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zM3 16h7v-2H3v2z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 109.5 16a6.5 6.5 0 004.2-1.6l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 110-9 4.5 4.5 0 010 9z"/></symbol>
<symbol id="i-set" viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 000-2l2.1-1.6-2-3.5-2.5 1a7.7 7.7 0 00-1.7-1L15 3h-4l-.4 2.7a7.7 7.7 0 00-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 000 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5-2.2-1.8zM13 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 00-2 2v14h2V3h12V1zm3 4H8a2 2 0 00-2 2v14a2 2 0 002 2h11a2 2 0 002-2V7a2 2 0 00-2-2zm0 16H8V7h11v14z"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></symbol>
<symbol id="i-paste" viewBox="0 0 24 24"><path d="M19 2h-4.2A3 3 0 0012 0a3 3 0 00-2.8 2H5a2 2 0 00-2 2v16a2 2 0 002 2h14a2 2 0 002-2V4a2 2 0 00-2-2zm-7 0a1 1 0 110 2 1 1 0 010-2zm7 18H5V4h2v3h10V4h2v16z"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2z"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 17.3l6.2 3.7-1.6-7 5.4-4.7-7.2-.6L12 2 9.2 8.7 2 9.3l5.4 4.7-1.6 7z"/></symbol>
<symbol id="i-star-o" viewBox="0 0 24 24"><path d="M22 9.2l-7.2-.6L12 2 9.2 8.6 2 9.2l5.5 4.7L5.8 21 12 17.3l6.2 3.7-1.6-7.1L22 9.2zM12 15.4l-3.8 2.3 1-4.3-3.3-2.9 4.4-.4L12 6.1l1.7 4 4.4.4-3.3 2.9 1 4.3-3.8-2.3z"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M7.4 8.6L12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><path d="M12 8a2 2 0 100-4 2 2 0 000 4zm0 2a2 2 0 100 4 2 2 0 000-4zm0 6a2 2 0 100 4 2 2 0 000-4z"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0012 4a8 8 0 108 8h-2a6 6 0 11-1.76-4.24L13 11h7V4l-2.35 2.35z"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 100 20 10 10 0 000-20zm0 18a8 8 0 110-16 8 8 0 010 16z"/></symbol>
<symbol id="i-save" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="M3.9 12A3.1 3.1 0 017 8.9h4V7H7a5 5 0 000 10h4v-1.9H7A3.1 3.1 0 013.9 12zM8 13h8v-2H8v2zm9-6h-4v1.9h4a3.1 3.1 0 010 6.2h-4V17h4a5 5 0 000-10z"/></symbol>
<symbol id="i-tv" viewBox="0 0 24 24"><path d="M21 3H3a2 2 0 00-2 2v12a2 2 0 002 2h5v2h8v-2h5a2 2 0 002-2V5a2 2 0 00-2-2zm0 14H3V5h18v12z"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M8.6 16.6L13.2 12 8.6 7.4 10 6l6 6-6 6z"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><path d="M18 8h-1V6a5 5 0 00-10 0v2H6a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V10a2 2 0 00-2-2zm-6 9a2 2 0 110-4 2 2 0 010 4zm3.1-9H8.9V6a3.1 3.1 0 016.2 0v2z"/></symbol>
<symbol id="i-lock-open" viewBox="0 0 24 24"><path d="M12 17a2 2 0 100-4 2 2 0 000 4zm6-9h-1V6a5 5 0 00-10 0h1.9a3.1 3.1 0 016.2 0v2H6a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V10a2 2 0 00-2-2zm0 12H6V10h12v10z"/></symbol>
<symbol id="i-history" viewBox="0 0 24 24"><path d="M13 3a9 9 0 00-9 9H1l3.9 3.9.1.1L9 12H6a7 7 0 112.05 4.95l-1.42 1.42A9 9 0 1013 3zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8z"/></symbol>
</defs></svg>

<div id="app">
  <header class="appbar" id="appbar">
    <h1 id="appbar-title">Cuentas</h1>
    <button class="acct-chip" id="acct-chip" onclick="openAccountSwitcher()" hidden>
      <span class="dot" id="acct-chip-dot"></span><span class="name" id="acct-chip-name"></span><small id="acct-chip-days"></small>
      <svg class="i"><use href="#i-down"/></svg>
    </button>
    <button class="ib" onclick="openSearch()" aria-label="Buscar"><svg class="i"><use href="#i-search"/></svg></button>
    <button class="ib" id="btn-settings" onclick="openSettings()" aria-label="Ajustes"><svg class="i"><use href="#i-set"/></svg></button>
  </header>

  <main>
    <!-- CUENTAS -->
    <section class="view" id="view-accounts"><div class="scroll" id="accounts-body"></div></section>

    <!-- EN VIVO -->
    <section class="view" id="view-live">
      <div class="chips" id="live-chips"></div>
      <div class="livebar" id="live-bar" hidden>
        <span id="live-count"></span><span class="bar"><i id="live-bar-on" style="width:0"></i><u id="live-bar-off" style="width:0"></u></span>
        <button class="btn sm icon-only" onclick="reloadLive()" aria-label="Recargar canales y guía" title="Recargar"><svg class="i"><use href="#i-refresh"/></svg></button>
        <button class="btn sm" id="btn-view" onclick="toggleLiveView()"></button>
        <button class="btn sm" id="btn-check" onclick="checkCurrent()"></button>
        <button id="btn-online" onclick="toggleOnlineOnly()" hidden><span>Solo en línea</span><span class="switch" id="sw-online"></span></button>
      </div>
      <div class="scroll" id="live-body"></div>
    </section>

    <!-- PELÍCULAS -->
    <section class="view" id="view-vod">
      <div class="scroll" id="vod-body"></div>
    </section>

    <!-- SERIES -->
    <section class="view" id="view-series">
      <div class="scroll" id="series-body"></div>
    </section>

    <!-- MI LISTA -->
    <section class="view" id="view-mylist"><div class="scroll" id="mylist-body"></div></section>
  </main>

  <nav class="nav" id="nav">
    <button data-tab="accounts" onclick="switchTab('accounts')"><svg class="i"><use href="#i-acc"/></svg>Cuentas</button>
    <button data-tab="live" onclick="switchTab('live')"><svg class="i"><use href="#i-live"/></svg>En vivo</button>
    <button data-tab="vod" onclick="switchTab('vod')"><svg class="i"><use href="#i-mov"/></svg>Películas</button>
    <button data-tab="series" onclick="switchTab('series')"><svg class="i"><use href="#i-ser"/></svg>Series</button>
    <button data-tab="mylist" onclick="switchTab('mylist')"><svg class="i"><use href="#i-list"/></svg>Mi lista<span class="sr" id="nav-list-count"></span></button>
  </nav>
</div>

<!-- Pantallas superpuestas: ficha, búsqueda, ajustes, detalles de cuenta -->
<div class="page detail" id="page-detail"></div>
<div class="page" id="page-search">
  <header class="appbar">
    <button class="ib" onclick="closeTop()" aria-label="Volver"><svg class="i"><use href="#i-back"/></svg></button>
    <div class="search" style="flex:1;margin:0">
      <svg class="i"><use href="#i-search"/></svg>
      <input id="search-input" type="text" enterkeyhint="search" placeholder="Canales, películas o series" autocomplete="off" oninput="onSearchInput()" onkeydown="if(event.key==='Enter')runSearch(true)">
      <button onclick="clearSearch()" aria-label="Borrar" id="search-clear" hidden><svg class="i"><use href="#i-close"/></svg></button>
    </div>
  </header>
  <div class="chips" id="search-filters"></div>
  <div class="seg" id="search-scope" style="margin:0 16px 10px" hidden></div>
  <div class="scroll" id="search-body"></div>
</div>
<div class="page" id="page-settings">
  <header class="appbar">
    <button class="ib" onclick="closeTop()" aria-label="Volver"><svg class="i"><use href="#i-back"/></svg></button>
    <h1>Ajustes</h1>
  </header>
  <div class="scroll" id="settings-body"></div>
</div>
<div class="page" id="page-account">
  <header class="appbar">
    <button class="ib" onclick="closeTop()" aria-label="Volver"><svg class="i"><use href="#i-back"/></svg></button>
    <h1 id="account-page-title">Detalles</h1>
  </header>
  <div class="scroll" id="account-body"></div>
</div>

<div class="scrim" id="scrim" onclick="closeTop()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sh-head"><h3 id="sheet-title"></h3><button class="ib" onclick="closeTop()" aria-label="Cerrar"><svg class="i"><use href="#i-close"/></svg></button></div>
  <div class="sh-body" id="sheet-body"></div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="js/app.js"></script>
<script src="js/tv.js"></script>
</body>
</html>
