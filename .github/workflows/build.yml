name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # para publicar la versión (Release) con el APK
  pull-requests: read   # para leer las novedades del PR que se publicó

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # Llave de firma fija (secretos SIGNING_KEYSTORE_BASE64 y SIGNING_STORE_PASSWORD).
      # Si no existen, se firma con la llave temporal de siempre.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Firma fija: activada"
          else
            echo "::warning::Sin secreto SIGNING_KEYSTORE_BASE64: el APK se firma con una llave temporal y no se podrá instalar encima de otra versión."
          fi

      - name: Build Release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: jox3
        # Si falla, los errores salen como avisos en el resumen (más fáciles de leer que el registro completo).
        run: |
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log || { grep -E -A14 "^e: |error:|What went wrong|Could not (find|resolve)|An issue was found" build.log | grep -v "^\s*$" | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JOX3-Verifier-APK
          path: app/build/outputs/apk/release/app-release.apk

      # Cada cambio que llega a main se publica como versión: la app la detecta
      # y ofrece instalarla sola (también en el TV box).
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION="2.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "JOX3-Verifier-$VERSION.apk"
          # Novedades para el aviso de actualización: la sección "## Novedades" del PR
          # (en palabras simples). Si no hay, el mensaje del cambio.
          PR_BODY=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].body // ""' 2>/dev/null || true)
          NOTES=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | awk '/^##+ *Novedades/{f=1;next} /^##/{f=0} f' | sed '/^\s*$/d')
          if [ -z "$NOTES" ]; then
            NOTES=$(printf '%s\n' "$HEAD_MSG" | grep -viE '^(merge pull request|co-authored-by|claude-session)' | sed '/^\s*$/d')
          fi
          gh release create "v$VERSION" "JOX3-Verifier-$VERSION.apk" \
            --title "JOX3 Verifier $VERSION" \
            --notes "${NOTES:-Mejoras y correcciones.}" \
            --target "${{ github.sha }}"
